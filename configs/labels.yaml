# Merge of the ADE20K 150-class labels into floor / not floor / ignore.
#
# Classes are named, not numbered: each entry must match exactly one row of
# objectInfo150.txt, either the full Name field or one of its comma-separated
# synonyms (case-insensitive). Indices are looked up at prep time.
# Every class not listed here is "not floor". ADE20K's unlabeled pixels (0)
# are always ignored.

output_values:
  not_floor: 0
  floor: 1
  ignore: 255

# Walkable ground surfaces for a pedestrian, indoor and outdoor.
# Road is deliberately "not floor" (see proposal: the target is a pedestrian).
floor:
  - floor
  - rug
  - sidewalk
  - path

# Ambiguous ground: walkable but not a ground plane (stairs, escalators) or
# natural terrain we don't want to force either way. Excluded from the loss
# and metrics rather than forced into either class.
ignore:
  - stairs
  - stairway
  - step
  - escalator
  - grass
  - earth
  - field
  - sand
